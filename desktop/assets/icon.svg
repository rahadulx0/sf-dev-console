<!--
  Application icon: the same mark the navigation rail shows.

  Salesforce Blue tile with the Lucide "cloud" glyph, at the same proportions as the
  in-app .brandmark (glyph occupies 62.5% of the tile). The tile is 824x824 inside a
  1024x1024 canvas with a 185.4 corner radius, which is the macOS app-icon convention.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#0176D3"/>
  <g
    transform="translate(512 512) scale(21.458) translate(-12 -12)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
  </g>
</svg>
